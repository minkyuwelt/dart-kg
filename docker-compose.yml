# Neo4j (Phase 3~4: 공시 조각 벡터·전문검색 + 관계 그래프). 노트북에서만 띄운다 (CLAUDE.md "Docker는 Neo4j에만").
#
#   docker compose up -d        # 띄우기 (처음은 이미지 내려받기 몇 분)
#   docker compose ps           # 상태
#   docker compose logs -f neo4j
#   docker compose down         # 멈추기 (데이터는 data/neo4j/ 에 남음)
#   docker compose down -v      # 데이터까지 지우기 — Neo4j는 DuckDB에서 언제든 다시 만들 수 있다
#
# 포트: 다른 수업 컨테이너가 7474·7687을 쓰고 있어 노트북 쪽은 .env의 NEO4J_HTTP_PORT·NEO4J_BOLT_PORT (기본 17474·17687).
# 비밀번호: .env의 NEO4J_PASSWORD (없으면 compose가 거부한다 — 기본값을 두지 않는다).
# 메모리: 노트북 RAM 32GB 기준 힙 2G + 페이지 캐시 4G (2026-11-25 결정). 30만 조각 × 1,024차원 벡터 인덱스 ≈ 1.2GB가 들어간다.
# 버전: 0004 실험과 같은 2026.06.0 고정. 바꾸면 전문검색 분석기·벡터 인덱스 동작을 다시 확인해야 한다.
services:
  neo4j:
    image: neo4j:2026.06.0-community
    container_name: dartkg-neo4j
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?.env에 NEO4J_PASSWORD를 적어 주세요}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-4G}
      # 한국어 전문검색은 cjk 분석기(기본 포함). 플러그인 불필요 (0004)
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
