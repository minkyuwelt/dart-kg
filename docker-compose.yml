# dart-kg 로컬 개발 환경 (노트북 RAM 16GB 기준)
#
# 서비스
#   postgres : 프로젝트 데이터(dartkg DB) + Airflow 메타데이터(airflow DB)를 함께 담는 PostgreSQL 17
#              pgvector가 들어간 이미지라 Phase 3(임베딩)에서 이미지를 바꿀 필요가 없다
#   airflow  : `airflow standalone` 하나로 scheduler, dag-processor, api-server, triggerer를 모두 띄운다
#              (Celery/Redis 없이 LocalExecutor → 메모리 절약)
#   neo4j    : Phase 4에서 추가 예정
#
# 사용법은 README.md의 "Docker로 실행하기" 참고. 값은 모두 .env에서 읽는다.

name: dart-kg

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB를 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1에만 열어서 노트북 밖(같은 와이파이의 다른 기기)에서는 접속할 수 없게 한다
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 실제 DB 파일. .gitignore의 data/에 해당하므로 커밋되지 않는다
      - ./data/postgres:/var/lib/postgresql/data
      # 데이터 폴더가 비어 있을 때(처음 한 번)만 실행되는 초기화 SQL
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: ./docker/airflow
    image: dart-kg-airflow:3.3.2
    restart: unless-stopped
    command: standalone
    # WSL 사용자와 같은 UID로 실행해야 ./logs에 쓸 수 있다 (그룹 0은 Airflow 이미지 규칙)
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    # DART_API_KEY 등 .env의 값을 DAG 안에서 os.getenv로 읽을 수 있게 넘긴다
    env_file: .env
    environment:
      # 컨테이너 안에서는 localhost가 아니라 서비스 이름(postgres)으로 DB에 접속한다
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Airflow 메타데이터는 같은 서버의 별도 DB(airflow)에 저장
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      # 로컬 개발용: 로그인 없이 관리자로 접속 (포트를 127.0.0.1에만 열어 둠)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # scheduler와 api-server가 같은 값을 써야 태스크가 실행된다
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?.env에 AIRFLOW_JWT_SECRET을 설정하세요}
      # DAG에서 `from src.collectors import ...`로 프로젝트 코드를 가져올 수 있게 한다
      PYTHONPATH: /opt/airflow
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
