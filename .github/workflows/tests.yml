# PR과 main에 push될 때 오프라인 테스트와 Dagster 정의 검사를 자동으로 실행한다.
# 결정 기록: docs/decisions/0003-ci.md
#
# - DART API는 호출하지 않는다. 테스트는 모두 가짜 응답을 쓰고, 이 워크플로에는 API 키(Secret)가 없다.
#   혹시 테스트가 실수로 실제 호출을 해도 가짜 키라서 DART가 거절한다 (DART_API_KEY=ci-dummy-key).
# - DuckDB 파일과 Dagster 실행 기록은 러너의 임시 폴더에만 생기고 job이 끝나면 사라진다.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 이전 실행은 취소한다
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 노트북(WSL Ubuntu)의 python3 버전이 이 안에 있어야 한다
        python-version: ["3.12", "3.13"]
    env:
      DART_API_KEY: ci-dummy-key
      DUCKDB_PATH: ${{ github.workspace }}/.ci/dartkg.duckdb
      DAGSTER_HOME: ${{ github.workspace }}/.ci/dagster_home
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 오프라인 테스트 (DART API 호출 없음)
        run: python -m unittest discover -s tests -t . -v

      - name: Dagster 정의 검사
        run: |
          mkdir -p "$DAGSTER_HOME"
          dagster definitions validate -m src.pipeline.definitions

  # 화면(web/, Vite + React): 타입 검사·빌드·린트. API를 부르지 않는다 (0013)
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
